spring.application.name=ai-finance-tracker

server.port=5000

# ---- Database ----
# Default: H2 in-memory so the project runs instantly with zero setup.
# Swap to MySQL for real persistence by uncommenting the block below
# and commenting out the H2 block.

spring.datasource.url=jdbc:h2:mem:financetracker;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# spring.datasource.url=jdbc:mysql://localhost:3306/ai_finance_tracker?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=replace_with_a_long_random_string_change_me_in_production_min_32_bytes
app.jwt.expiration-ms=604800000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173

# ---- AI (OpenAI) ----
# Optional. Leave blank/placeholder to use the built-in heuristic insight engine.
app.openai.api-key=
app.openai.model=gpt-4o-mini
app.openai.base-url=https://api.openai.com/v1/chat/completions
